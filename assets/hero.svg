<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Spandan Das Hero Banner">
  <defs>
    <!-- Aurora Accent Ramp & Card Borders -->
    <linearGradient id="hero-aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.55" />
    </linearGradient>

    <!-- Subtle Dot Texture -->
    <pattern id="hero-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045" />
    </pattern>

    <!-- Soft Edge Vignette Mask so video melts into #0d0e16 -->
    <radialGradient id="hero-edge-grad" cx="50%" cy="50%" r="52%">
      <stop offset="68%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="hero-video-mask">
      <rect x="445" y="42" width="420" height="248" rx="14" fill="url(#hero-edge-grad)" />
    </mask>

    <!-- Rising Name Reveal Mask (starts revealed at t=0 fallback, animates smoothly) -->
    <mask id="hero-name-mask">
      <rect x="36" y="102" width="390" height="58" fill="#ffffff">
        <animate attributeName="y" values="160;102;102" keyTimes="0;0.14;1" dur="6s" fill="freeze" />
        <animate attributeName="height" values="0;58;58" keyTimes="0;0.14;1" dur="6s" fill="freeze" />
      </rect>
    </mask>

    <style>
      .hero-display { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
      .hero-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
      .hero-enter {
        animation: heroFadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes heroFadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .hero-bracket {
        stroke-dasharray: 44;
        stroke-dashoffset: 0;
        animation: heroDrawBracket 0.9s ease-out both;
      }
      @keyframes heroDrawBracket {
        from { stroke-dashoffset: 44; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Midnight Glass Card Base -->
  <rect x="1" y="1" width="898" height="338" rx="20" fill="#0d0e16" stroke="url(#hero-border)" stroke-width="1.5" />
  <rect x="1" y="1" width="898" height="338" rx="20" fill="url(#hero-dots)" />

  <!-- Ambient Aurora Glow -->
  <ellipse cx="660" cy="170" rx="180" ry="110" fill="#a78bfa" opacity="0.08" />
  <ellipse cx="180" cy="140" rx="160" ry="90" fill="#22d3ee" opacity="0.06" />

  <!-- LEFT COLUMN: Identity & Telemetry -->
  <g class="hero-enter">
    <!-- Open to Collabs Pill -->
    <rect x="36" y="34" width="154" height="28" rx="14" fill="#151828" stroke="#22d3ee" stroke-opacity="0.35" />
    <circle cx="52" cy="48" r="4.5" fill="#22d3ee">
      <animate attributeName="r" values="3.5;5.5;3.5" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.45;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="65" y="52" class="hero-mono" font-size="11" fill="#e2e8f0" letter-spacing="0.4">OPEN TO COLLABS</text>

    <!-- Typed Greeting -->
    <text x="36" y="92" class="hero-mono" font-size="15" fill="#94a3b8">Hi there, I'm<tspan fill="#22d3ee">_<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite" /></tspan></text>

    <!-- Rising Masked Name -->
    <g mask="url(#hero-name-mask)">
      <text x="36" y="148" class="hero-display" font-size="46" font-weight="700" fill="url(#hero-aurora)" letter-spacing="-1">Spandan Das</text>
    </g>

    <!-- Cycling Role Lines (SMIL 0s start with keyTimes) -->
    <g font-size="16" font-weight="600" class="hero-display">
      <text x="36" y="182" fill="#f8fafc" opacity="1">
        Student @ Techno India University
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.28;0.33;0.95;0.99;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="36" y="182" fill="#22d3ee" opacity="0">
        Frontend & Web Design Builder
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.36;0.63;0.68;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="36" y="182" fill="#f472b6" opacity="0">
        Python, Hadoop & Creative Coder
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.96;1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- One-Line Pitch -->
    <text x="36" y="214" class="hero-display" font-size="13.5" fill="#94a3b8">
      Crafting clean interfaces, data workflows, and anime-inspired web apps.
    </text>

    <!-- Meta Row: Location, University, Stars/Repos -->
    <g transform="translate(36, 248)" class="hero-mono" font-size="11.5" fill="#cbd5e1">
      <!-- Location Pin -->
      <path d="M7 1C4.2 1 2 3.2 2 6c0 3.8 5 9 5 9s5-5.2 5-9c0-2.8-2.2-5-5-5zm0 6.8A1.8 1.8 0 1 1 7 4.2a1.8 1.8 0 0 1 0 3.6z" fill="#22d3ee" />
      <text x="19" y="12">Howrah, IN</text>

      <!-- College Icon -->
      <path d="M112 2L103 6.5l9 4.5 7.4-3.7V13h1.6V6.5L112 2zm-5.5 6.8v3.4c0 1.6 2.5 2.8 5.5 2.8s5.5-1.2 5.5-2.8V8.8l-5.5 2.7-5.5-2.7z" fill="#a78bfa" />
      <text x="127" y="12">Techno India Univ</text>

      <!-- Star + Repo Icon -->
      <path d="M276 1.5l1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6z" fill="#f472b6" />
      <text x="288" y="12">12 Repos · 28 Stars</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Camera Viewfinder + 5.4s Looping Video Frames -->
  <g>
    <!-- Video Backdrop & Masked Frame Stack -->
    <rect x="445" y="42" width="420" height="248" rx="14" fill="#131522" />
    <g id="hero-video-frames" mask="url(#hero-video-mask)">
      <!-- Base/Last Frame stays visible at opacity 1 so static renderers & hold period show your wave -->
      
      <!-- build_profile.py populates 40 sequential <image> frames here with 5.4s keyTimes (0-3.6s play, 3.6-5.0s hold, 5.0-5.4s fade) -->
    </g>

    <!-- Viewfinder Corner Brackets -->
    <g fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
      <path class="hero-bracket" d="M442 62 V40 H464" />
      <path class="hero-bracket" d="M846 40 H868 V62" />
      <path class="hero-bracket" d="M442 272 V294 H464" />
      <path class="hero-bracket" d="M846 294 H868 V272" />
    </g>

    <!-- Blinking REC Indicator & Filename -->
    <circle cx="460" cy="56" r="4.5" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.15;1" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <text x="471" y="60" class="hero-mono" font-size="10.5" fill="#f8fafc" font-weight="700">REC</text>
    <text x="752" y="60" class="hero-mono" font-size="10" fill="#94a3b8">spandan_wave.mp4</text>

    <!-- Synced Scrubber Bar (5.4s loop: 0->3.6s play, 3.6->5.0s hold, 5.0->5.4s reset) -->
    <rect x="462" y="276" width="386" height="4" rx="2" fill="#ffffff" fill-opacity="0.16" />
    <rect x="462" y="276" width="386" height="4" rx="2" fill="url(#hero-aurora)">
      <animate attributeName="width" values="0;386;386;0" keyTimes="0;0.67;0.93;1" dur="5.4s" repeatCount="indefinite" />
    </rect>
    <circle cx="848" cy="278" r="4.5" fill="#ffffff">
      <animate attributeName="cx" values="462;848;848;462" keyTimes="0;0.67;0.93;1" dur="5.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
