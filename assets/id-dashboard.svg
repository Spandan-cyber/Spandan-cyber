<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-label="Spandan Das ID Badge and GitHub Telemetry Dashboard">
  <defs>
    <linearGradient id="id-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="id-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="id-holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
    <pattern id="id-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045" />
    </pattern>
    <clipPath id="id-portrait-clip">
      <rect x="64" y="138" width="132" height="132" rx="14" />
    </clipPath>
    <clipPath id="id-card-clip">
      <rect x="34" y="92" width="192" height="276" rx="16" />
    </clipPath>

    <style>
      .id-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
      .id-mono { font-family: 'JetBrains Mono', monospace; }
      /* Damped Pendulum Drop & Swing (ends at 0deg so static render is straight) */
      .id-pendulum {
        transform-origin: 130px 0px;
        animation: idSwing 3.4s cubic-bezier(0.25, 1, 0.5, 1) both;
      }
      @keyframes idSwing {
        0%   { transform: translateY(-42px) rotate(-11deg); opacity: 0; }
        22%  { transform: translateY(0px) rotate(8.5deg); opacity: 1; }
        42%  { transform: translateY(0px) rotate(-5.5deg); }
        62%  { transform: translateY(0px) rotate(3deg); }
        80%  { transform: translateY(0px) rotate(-1.2deg); }
        100% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="388" rx="20" fill="#0d0e16" stroke="url(#id-border)" stroke-width="1.5" />
  <rect x="1" y="1" width="898" height="388" rx="20" fill="url(#id-dots)" />

  <!-- LEFT: Swinging Lanyard ID Badge -->
  <g class="id-pendulum">
    <!-- Lanyard Strap with Printed Text -->
    <polygon points="108,0 152,0 142,76 118,76" fill="#171b2e" stroke="#22d3ee" stroke-opacity="0.4" />
    <text x="130" y="42" text-anchor="middle" class="id-mono" font-size="8" fill="#22d3ee" letter-spacing="1.5" transform="rotate(-90 130 42)">SPANDAN</text>

    <!-- Metal Clasp -->
    <rect x="116" y="72" width="28" height="14" rx="4" fill="#94a3b8" />
    <rect x="122" y="82" width="16" height="14" rx="3" fill="#cbd5e1" />

    <!-- Badge Body -->
    <g clip-path="url(#id-card-clip)">
      <rect x="34" y="92" width="192" height="276" rx="16" fill="#131626" stroke="url(#id-border)" stroke-width="1.5" />
      <!-- Top Header Strip -->
      <rect x="34" y="92" width="192" height="34" fill="#1a1f36" />
      <text x="50" y="113" class="id-mono" font-size="10" font-weight="700" fill="#22d3ee">DEV PASS // 2026</text>
      <circle cx="206" cy="109" r="4" fill="#f472b6" />

      <!-- Portrait Frame with Travelling Light Border -->
      <rect x="64" y="138" width="132" height="132" rx="14" fill="#1c2138" />
      <g clip-path="url(#id-portrait-clip)">
        
      </g>
      <rect x="64" y="138" width="132" height="132" rx="14" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="90 420">
        <animate attributeName="stroke-dashoffset" from="510" to="0" dur="3.5s" repeatCount="indefinite" />
      </rect>

      <!-- Gold EMV Chip -->
      <rect x="50" y="284" width="28" height="21" rx="4" fill="url(#id-gold)" />
      <path d="M50 291h28M50 298h28M59 284v21M69 284v21" stroke="#713f12" stroke-width="0.9" />

      <!-- Name & Role -->
      <text x="88" y="295" class="id-display" font-size="14" font-weight="700" fill="#f8fafc">Spandan Das</text>
      <text x="88" y="309" class="id-mono" font-size="9.5" fill="#a78bfa">@Spandan-cyber</text>

      <!-- Barcode -->
      <g transform="translate(50, 324)" fill="#cbd5e1" opacity="0.85">
        <rect x="0" y="0" width="2" height="22" /><rect x="4" y="0" width="4" height="22" />
        <rect x="11" y="0" width="1.5" height="22" /><rect x="15" y="0" width="3" height="22" />
        <rect x="21" y="0" width="2" height="22" /><rect x="26" y="0" width="5" height="22" />
        <rect x="34" y="0" width="2" height="22" /><rect x="39" y="0" width="3" height="22" />
        <rect x="45" y="0" width="1.5" height="22" /><rect x="50" y="0" width="4" height="22" />
        <rect x="57" y="0" width="2" height="22" /><rect x="62" y="0" width="3" height="22" />
        <text x="76" y="15" class="id-mono" font-size="9" fill="#94a3b8">TIU-BCA-2B</text>
      </g>

      <!-- Holographic Foil Sweep -->
      <rect x="-160" y="92" width="160" height="276" fill="url(#id-holo)" transform="skewX(-18)">
        <animate attributeName="x" values="-160;420;420" keyTimes="0;0.45;1" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- RIGHT: GitHub Telemetry Dashboard -->
  <g transform="translate(262, 24)">
    <!-- KPI Tiles Row (Numbers Count Up via SMIL) -->
    <g>
      <!-- KPI 1 -->
      <rect x="0" y="0" width="194" height="78" rx="14" fill="#131626" stroke="#22d3ee" stroke-opacity="0.28" />
      <text x="16" y="24" class="id-mono" font-size="10" fill="#94a3b8">PUBLIC REPOS</text>
      <text x="16" y="58" class="id-display" font-size="28" font-weight="700" fill="#22d3ee">12</text>
      <text x="128" y="56" class="id-mono" font-size="10" fill="#34d399">+4 THIS YR</text>

      <!-- KPI 2 -->
      <rect x="208" y="0" width="194" height="78" rx="14" fill="#131626" stroke="#a78bfa" stroke-opacity="0.28" />
      <text x="224" y="24" class="id-mono" font-size="10" fill="#94a3b8">TOTAL STARS</text>
      <text x="224" y="58" class="id-display" font-size="28" font-weight="700" fill="#a78bfa">28</text>
      <text x="332" y="56" class="id-mono" font-size="10" fill="#c4b5fd">OSS IMPACT</text>

      <!-- KPI 3 -->
      <rect x="416" y="0" width="196" height="78" rx="14" fill="#131626" stroke="#f472b6" stroke-opacity="0.28" />
      <text x="432" y="24" class="id-mono" font-size="10" fill="#94a3b8">CORE FOCUS</text>
      <text x="432" y="58" class="id-display" font-size="24" font-weight="700" fill="#f472b6">Full-Stack</text>
    </g>

    <!-- Single-Hue Bar Chart of Most-Starred Repos -->
    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="386" height="248" rx="14" fill="#131626" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="18" y="26" class="id-display" font-size="14" font-weight="700" fill="#f8fafc">Most-Starred Repositories</text>
      <text x="292" y="26" class="id-mono" font-size="10" fill="#22d3ee">@Spandan-cyber</text>

      <!-- Bar 1: Gatherly (11 stars) -->
      <text x="18" y="58" class="id-mono" font-size="11.5" fill="#e2e8f0">Gatherly</text>
      <rect x="18" y="66" width="310" height="16" rx="5" fill="#22d3ee" fill-opacity="0.14" />
      <rect x="18" y="66" width="290" height="16" rx="5" fill="#22d3ee">
        <animate attributeName="width" values="0;290;290" keyTimes="0;0.18;1" dur="6s" fill="freeze" />
      </rect>
      <text x="338" y="78" class="id-mono" font-size="11" font-weight="700" fill="#22d3ee">11 ★</text>

      <!-- Bar 2: TerraMind-AI (8 stars) -->
      <text x="18" y="106" class="id-mono" font-size="11.5" fill="#e2e8f0">TerraMind-AI</text>
      <rect x="18" y="114" width="310" height="16" rx="5" fill="#22d3ee" fill-opacity="0.14" />
      <rect x="18" y="114" width="215" height="16" rx="5" fill="#22d3ee" fill-opacity="0.82">
        <animate attributeName="width" values="0;215;215" keyTimes="0;0.24;1" dur="6s" fill="freeze" />
      </rect>
      <text x="338" y="126" class="id-mono" font-size="11" font-weight="700" fill="#22d3ee">8 ★</text>

      <!-- Bar 3: QueueQuest (5 stars) -->
      <text x="18" y="154" class="id-mono" font-size="11.5" fill="#e2e8f0">QueueQuest</text>
      <rect x="18" y="162" width="310" height="16" rx="5" fill="#22d3ee" fill-opacity="0.14" />
      <rect x="18" y="162" width="142" height="16" rx="5" fill="#22d3ee" fill-opacity="0.66">
        <animate attributeName="width" values="0;142;142" keyTimes="0;0.30;1" dur="6s" fill="freeze" />
      </rect>
      <text x="338" y="174" class="id-mono" font-size="11" font-weight="700" fill="#22d3ee">5 ★</text>

      <!-- Bar 4: Z-CALC-9000 (4 stars) -->
      <text x="18" y="202" class="id-mono" font-size="11.5" fill="#e2e8f0">Z-CALC-9000</text>
      <rect x="18" y="210" width="310" height="16" rx="5" fill="#22d3ee" fill-opacity="0.14" />
      <rect x="18" y="210" width="114" height="16" rx="5" fill="#22d3ee" fill-opacity="0.52">
        <animate attributeName="width" values="0;114;114" keyTimes="0;0.36;1" dur="6s" fill="freeze" />
      </rect>
      <text x="338" y="222" class="id-mono" font-size="11" font-weight="700" fill="#22d3ee">4 ★</text>
    </g>

    <!-- NOW Panel -->
    <g transform="translate(402, 94)">
      <rect x="0" y="0" width="210" height="248" rx="14" fill="#131626" stroke="#a78bfa" stroke-opacity="0.25" />
      <circle cx="22" cy="24" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="28" class="id-mono" font-size="11" font-weight="700" fill="#f8fafc">NOW // STATUS</text>

      <text x="18" y="60" class="id-mono" font-size="10" fill="#22d3ee">STUDYING</text>
      <text x="18" y="77" class="id-display" font-size="12.5" fill="#e2e8f0">BCA @ Techno India</text>
      <text x="18" y="93" class="id-display" font-size="12.5" fill="#94a3b8">University, Kolkata</text>

      <text x="18" y="126" class="id-mono" font-size="10" fill="#a78bfa">BUILDING</text>
      <text x="18" y="143" class="id-display" font-size="12.5" fill="#e2e8f0">Full-stack apps &</text>
      <text x="18" y="159" class="id-display" font-size="12.5" fill="#94a3b8">Hadoop data pipelines</text>

      <text x="18" y="192" class="id-mono" font-size="10" fill="#f472b6">OFF-SCREEN</text>
      <text x="18" y="209" class="id-display" font-size="12.5" fill="#e2e8f0">Sketching characters</text>
      <text x="18" y="225" class="id-display" font-size="12.5" fill="#94a3b8">& watching anime</text>
    </g>
  </g>
</svg>